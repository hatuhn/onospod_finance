 <div class="itemgrid"><div class="stat">${tr('Topup Amount','Số tiền nạp')}<b>${money(t.amount)}</b></div><div class="stat">${tr('Wallet Posted','Đã cộng vào ví')}<b>${t.status==='Approved'?money(t.amount):money(0)}</b></div><div class="stat">${tr('Current Wallet','Ví hiện tại')}<b>${money(b)}</b></div></div>
 ${card(tr('Approval & Audit Trail','Duyệt giao dịch & Lịch sử'),'',`<div class="line"><span>${tr('Bank Reference','Mã ngân hàng')}</span><strong>${t.bankReference}</strong></div><div class="line"><span>${tr('Recorded By','Người ghi nhận')}</span><strong>${t.createdBy||'—'}</strong></div><div class="line"><span>${tr('Approved / Rejected By','Người duyệt / từ chối')}</span><strong>${t.approvedBy||'—'}</strong></div><div class="line"><span>${tr('Reviewed At','Thời gian duyệt')}</span><strong>${t.approvedAt||'—'}</strong></div><div class="line"><span>${tr('Status','Trạng thái')}</span><strong>${topupStatusBadge(t.status)}</strong></div>`)}
 ${t.status==='Pending'?`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" data-topup-approve="${t.id}">${tr('Approve Topup','Duyệt Topup')}</button><button class="btn" data-topup-reject="${t.id}">${tr('Reject Topup','Từ chối')}</button></div>`:''}`);
}
function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;let c=getCustomer(o.customer),lineItems=[['Production',o.revenueProd,o.costProd],['Shipping',o.revenueShip,o.costShip],['Tax & Fees',o.revenueTax,o.costTax],['Other',0,o.costOther]];showDrawer(`<h2>${o.id}</h2><p class="sub">${c.name} · ${tierBadge(c.tier)} · ${getFactory(o.factory)} · ${o.date}</p><div class="itemgrid"><div class="stat">${tr('Revenue','Doanh thu')}<b>${money(orderRevenue(o))}</b></div><div class="stat">${tr('Direct Costs','Chi phí')}<b>${money(orderCosts(o))}</b></div><div class="stat">${tr('Profit','Lãi/lỗ')}<b>${money(orderProfit(o))}</b></div></div>${card(tr('Order Financial Breakdown','Chi tiết tài chính đơn'),tr('Income and spending are separated for each category','Tách thu và chi của từng hạng mục'),table([tr('Category','Hạng mục'),tr('Collected','Thu khách'),tr('Paid','Chi thực tế'),tr('Margin','Lãi')],lineItems.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${money(x[2])}</td><td>${profit(round(x[1]-x[2]))}</td></tr>`)))}${orderPaymentInvoiceDetail(o)}${card(tr('Production & Fulfillment','Sản xuất & Vận chuyển'),'',`<div class="line"><span>SKU / Product</span><strong>${o.sku} / ${o.category}</strong></div><div class="line"><span>Units</span><strong>${o.units}</strong></div><div class="line"><span>Factory</span><strong>${getFactory(o.factory)}</strong></div><div class="line"><span>Carrier</span><strong>${o.carrier}</strong></div><div class="line"><span>Status</span><strong>${o.status}</strong></div><div class="line"><span>Cost Status</span><strong>${o.settlement}</strong></div>`)}${refunds.some(r=>r.orderId===o.id)?card(tr('Refund History','Lịch sử hoàn tiền'),tr('Refund transactions can occur months after order creation','Refund có thể phát sinh nhiều tháng sau ngày tạo đơn'),table([tr('Refund Date','Ngày hoàn'),tr('Refund ID','Mã hoàn'),tr('Refund Amount','Tiền hoàn'),tr('Profit Impact','Ảnh hưởng lãi')],refunds.filter(r=>r.orderId===o.id).map(r=>`<tr><td>${r.date}</td><td>${r.id}</td><td>${money(r.amount)}</td><td>${profit(refundImpact(r))}</td></tr>`))+`<div class="line"><span>${tr('Total refunded (lifetime)','Tổng tiền đã hoàn')}</span><strong>${money(orderRefundTotal(o.id))}</strong></div><div class="line"><span>${tr('Adjusted lifetime direct profit','Lãi trực tiếp sau hoàn (lũy kế)')}</span><strong>${money(round(orderProfit(o)+orderRefundImpact(o.id)))}</strong></div>`):''}${o.type==='Debit'?card(tr('Order Debt','Công nợ đơn hàng'),'',`<div class="line"><span>Charge</span><strong>${money(orderRevenue(o))}</strong></div><div class="line"><span>Paid / Allocated</span><strong>${money(o.paid)}</strong></div><div class="line"><span>Outstanding</span><strong>${money(round(orderRevenue(o)-o.paid))}</strong></div>`):''}`)}
function openCustomer(id){let c=getCustomer(id),os=orders.filter(o=>o.customer===id),inv=invoices.filter(i=>i.customer===id);showDrawer(`<h2>${c.name}</h2><p class="sub">${c.id} · ${tierBadge(c.tier)} · ${c.type}</p><div class="itemgrid"><div class="stat">Wallet Balance<b>${money(customerBalance(c))}</b></div><div class="stat">Outstanding Debt<b>${money(Math.max(0,-customerBalance(c)))}</b></div><div class="stat">Debit Limit<b>${money(c.limit)}</b></div></div>${card(tr('All Customer Orders','Đơn hàng của khách'),`${os.length} orders`,table(['Order','Date','Revenue','Paid','Debt'],os.map(o=>`<tr><td>${orderLink(o)}</td><td>${o.date}</td><td>${money(orderRevenue(o))}</td><td>${money(o.paid)}</td><td>${money(o.type==='Debit'?round(orderRevenue(o)-o.paid):0)}</td></tr>`)))}${card(tr('Monthly Invoices','Hóa đơn tháng'),'',table(['Invoice','Total','Paid','Remaining'],inv.map(i=>`<tr><td><a class="click" data-invoice="${i.id}">${i.id}</a></td><td>${money(invoiceAmount(i))}</td><td>${money(invoicePaid(i))}</td><td>${money(round(invoiceAmount(i)-invoicePaid(i)))}</td></tr>`)))}`)}
function openInvoice(id){let i=invoices.find(i=>i.id===id);if(!i)return;showDrawer(`<h2>${i.id}</h2><p class="sub">${getCustomer(i.customer).name} · ${i.month.slice(0,7)} · ${badge(invoiceStatus(i),invoiceStatus(i)==='Paid'?'green':'amber')}</p><div class="itemgrid"><div class="stat">Invoice Total<b>${money(invoiceAmount(i))}</b></div><div class="stat">Approved Paid<b>${money(invoicePaid(i))}</b></div><div class="stat">Remaining<b>${money(round(invoiceAmount(i)-invoicePaid(i)))}</b></div></div>${card(tr('Invoice Order Lines','Các đơn trong hóa đơn'),tr('Exact linked orders and payments','Đơn hàng liên kết và số tiền đã trả'),table(['Order','Date','Charge','Paid','Remaining'],invoiceOrders(i).map(o=>`<tr><td>${orderLink(o)}</td><td>${o.date}</td><td>${money(orderRevenue(o))}</td><td>${money(o.paid)}</td><td>${money(round(orderRevenue(o)-o.paid))}</td></tr>`)))}${card(tr('Invoice Approval','Duyệt hóa đơn'),'',`<div class="line"><span>Approved By</span><strong>${i.approvedBy}</strong></div><div class="line"><span>Due Date</span><strong>${i.due}</strong></div><div class="line"><span>Status</span><strong>${invoiceStatus(i)}</strong></div>` )}`)}
document.addEventListener('click',e=>{let trend=e.target.closest('[data-overview-chart]');if(trend){state.overviewChart=trend.dataset.overviewChart;render();return}let clear=e.target.closest('[data-clear-invoice]');if(clear){state.invoiceId='';state.invoicePresence='all';render();return}let presence=e.target.closest('[data-invoice-presence]');if(presence){state.invoicePresence=presence.dataset.invoicePresence;render();return}let view=e.target.closest('[data-order-view]');if(view){state.ordersView=view.dataset.orderView;render();return}let a=e.target.closest('[data-topup-approve]');if(a){topupApprove(a.dataset.topupApprove,true);return}a=e.target.closest('[data-topup-reject]');if(a){topupApprove(a.dataset.topupReject,false);return}a=e.target.closest('[data-topup]');if(a){openTopup(a.dataset.topup);return}a=e.target.closest('[data-topup-status]');if(a){state.topupStatus=a.dataset.topupStatus;render();return}a=e.target.closest('[data-order]');if(a){openOrder(a.dataset.order);return}a=e.target.closest('[data-customer]');if(a){openCustomer(a.dataset.customer);return}a=e.target.closest('[data-invoice]');if(a){openInvoice(a.dataset.invoice);return}a=e.target.closest('[data-approve]');if(a){approve(a.dataset.approve,true);return}a=e.target.closest('[data-reject]');if(a){approve(a.dataset.reject,false);return}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDrawer()});
document.addEventListener('input',e=>{
 if(e.target.id!=='invoiceIdFilter')return;
 const pos=e.target.selectionStart||0;
 state.invoiceId=e.target.value.replace(/[^a-zA-Z0-9_-]/g,'').toUpperCase();
 document.getElementById('pageContent').innerHTML=views[state.page]();
 const input=document.getElementById('invoiceIdFilter');if(input){input.focus();input.setSelectionRange(Math.min(pos,state.invoiceId.length),Math.min(pos,state.invoiceId.length))}
});

for(const [id,k] of [['factoryFilter','factory'],['tierFilter','tier'],['typeFilter','type'],['userFilter','user']])document.getElementById(id).addEventListener('change',e=>{state[k]=e.target.value;render()});
document.getElementById('searchInput').addEventListener('input',e=>{state.q=e.target.value;let start=e.target.selectionStart;document.getElementById('pageContent').innerHTML=views[state.page]();});
for(const [id,k] of [['fromDate','from'],['toDate','to']])document.getElementById(id).onchange=e=>{state[k]=e.target.value;if(state.from>state.to){state.to=state.from;}render()};
function currentCSV(){
 const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const lines=[];
 if(state.page==='wallet'){
  lines.push(['TopupID','Date','CustomerID','Customer','Amount','Method','BankReference','RecordedBy','Status','ApprovedBy','ApprovedAt'].join(','));
  for(const t of walletTopupRows())lines.push([t.id,t.date,t.customer,getCustomer(t.customer).name,t.amount,t.method,t.bankReference,t.createdBy,t.status,t.approvedBy,t.approvedAt].map(quote).join(','));
 }else if(state.page==='orders'&&state.ordersView==='refunded'){
  lines.push(['RefundID','RefundDate','OriginalOrderID','OrderDate','InvoiceIDs','Customer','Factory','RefundAmount','CostRecovery','ProfitImpact','ApprovedBy'].join(','));
  for(const r of invoiceFilteredRefundRows()){let o=orders.find(o=>o.id===r.orderId);lines.push([r.id,r.date,r.orderId,o.date,invoiceIdsForOrder(o).join('; '),getCustomer(r.customer).name,getFactory(r.factory),r.amount,r.recovery,refundImpact(r),r.approvedBy].map(quote).join(','))}
 }else{
  lines.push(['Order','Date','InvoiceIDs','Customer','CustomerTier','Factory','SKU','Units','ProductionRevenue','ShippingRevenue','TaxFeeRevenue','OrderRevenue','ProductionCost','ShippingCost','TaxFeeCost','OtherCost','DirectCost','Profit','Status'].join(','));
  const a=state.page==='orders'?invoiceFilteredOrderRows():orderRows();
  for(const o of a)lines.push([o.id,o.date,invoiceIdsForOrder(o).join('; '),getCustomer(o.customer).name,o.tier,getFactory(o.factory),o.sku,o.units,o.revenueProd,o.revenueShip,o.revenueTax,orderRevenue(o),o.costProd,o.costShip,o.costTax,o.costOther,orderCosts(o),orderProfit(o),o.status].map(quote).join(','));
 }
 return '\ufeff'+lines.join('\r\n');
}
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([currentCSV()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='onospod_finance_'+(state.page==='wallet'?'topups':state.page==='orders'&&state.ordersView==='refunded'?'refunds':'orders')+'_'+state.from+'_'+state.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
resolveDates();render();
